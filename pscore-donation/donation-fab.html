      /* =========================================
     DONATION FAB
     Default state = collapsed
     ========================================= */

  .donate-fab {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 1041;

      overflow: hidden;
      cursor: pointer;

      transition:
          width 0.35s ease,
          min-width 0.35s ease,
          border-radius 0.35s ease,
          box-shadow 0.35s ease;
  }
  .donate-fab:not(.is-open) {
      width: 110px!important;
      height: 54px!important;
      min-height: 54px!important;
      justify-content: center;
  }
  /* =========================================
     HIDE EXPANDED CONTENT
     ========================================= */

  .donate-fab:not(.is-open) .donate-fab-inner {
      display: none !important;
  }


  /* =========================================
     OPEN STATE
     ========================================= */

  /* Hide small button when expanded */

  .donate-fab.is-open #donate-fab-small {
      display: none !important;
  }


  /* Show expanded content */

  .donate-fab.is-open .donate-fab-inner {

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const fab = document.querySelector(".donate-fab");
    const smallFab = document.querySelector("#donate-fab-small");
    const donatae = fab?.querySelector(".eae-button-1-wrapper");
    const maybeLater = fab?.querySelector(".eae-button-2-wrapper");

    if (!fab || !smallFab) return;

    /* Enlarge */
    smallFab.addEventListener("click", function () {
      fab.classList.add("is-open");
    });

    /* Donate */
    if (donatae) {
      donatae.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();

        console.log(
          "elem",
          document.getElementById("modal-trigger").children[0].children[0]
            .children[0],
        );
        document
          .getElementById("modal-trigger")
          .children[0].children[0].children[0].click();
      });
    }
    /* Close */
    if (maybeLater) {
      maybeLater.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();

        fab.classList.remove("is-open");
      });
    }
  });
</script>
